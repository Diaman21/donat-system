name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 — та же версия, на которой тесты гоняются локально.
          # В Node 22 glob-шаблон в `node --test` ведёт себя иначе.
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Тесты чистой логики (разбор состава заказа, даты МСК).
      # Секреты и сеть не нужны — модули под тестом не ходят в БД.
      - run: npm test
